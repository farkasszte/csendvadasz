<!doctype html>
<!-- Csendvadász: a magyar változat módosítása (lásd NOTICE.md) -->
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <script>
      // The page is prerendered without a Scene, which appears only once the
      // saved one is known. Until then, paint the saved Scene's colours so a
      // reload doesn't flash. Keep in step with settings.svelte.ts.
      try {
        var saved = JSON.parse(
          localStorage.getItem("class-noise-level:settings") || "{}",
        ).scene;
        if (saved) document.documentElement.dataset.scene = saved;
      } catch (e) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
