  <path d="M94 4 C 98 10, 102 20, 104 28 L98 28 C 96 20, 94 12, 90 5 Z" fill="#2b2b3a" opacity="0.16"/>
  <path d="M80 6 C 84 3, 91 2, 94 4 C 90 7, 84 8, 80 6 Z" fill="#d9b98a"/>
