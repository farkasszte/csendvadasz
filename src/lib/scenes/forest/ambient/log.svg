           C 92 17, 74 18, 64 23 C 52 19, 36 19, 26 21 C 18 22, 14 22, 11.75 22.51 Z" fill="#ffffff" opacity="0.18"/>
  <!-- Cut end with rings. -->
  <ellipse cx="244" cy="50" rx="22" ry="28" fill="#d9b98a"/>
  <ellipse cx="245" cy="50" rx="15" ry="20" fill="#c9a274"/>
  <ellipse cx="246" cy="50" rx="9" ry="12" fill="#d9b98a"/>
