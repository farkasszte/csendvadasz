  <g clip-path="url(#arctic-rock-stone)">
    <path d="M96 26 C 110 36, 118 54, 114 70 L70 70 C 86 60, 92 42, 96 26 Z" fill="#2b2b3a" opacity="0.25"/>
    <path d="M0 0 L120 0 L120 34 C 110 30, 104 34, 96 30 C 88 36, 80 30, 72 34 C 64 30, 56 36, 48 31 C 40 36, 30 32, 22 38 C 14 34, 6 40, 0 38 Z" fill="#f4f8fc"/>
