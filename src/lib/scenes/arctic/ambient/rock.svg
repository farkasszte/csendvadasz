<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70">
  <!-- A blue-grey boulder poking through the snow, with snow lying on its top,
       cut to the stone's outline. Rooted on the bottom edge. Identical
       wherever it is drawn, so the repeated id always means the same shape. -->
