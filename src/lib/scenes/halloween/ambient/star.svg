<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <!-- A twinkling star: a small round white point in a soft warm halo.
       Round, never a four-pointed sparkle, which marks a newcomer. -->
  <circle cx="10" cy="10" r="10" fill="#f6d27a" opacity="0.07"/>
  <circle cx="10" cy="10" r="6.5" fill="#f6d27a" opacity="0.1"/>
  <circle cx="10" cy="10" r="4" fill="#ffffff" opacity="0.25"/>
  <circle cx="10" cy="10" r="2.2" fill="#ffffff"/>
</svg>
