<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 206 101">
  <defs>
    <linearGradient id="space-space-probe-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dc92"/>
      <stop offset="0.55" stop-color="#c99a3e"/>
      <stop offset="1" stop-color="#7d5a20"/>
    </linearGradient>
    <linearGradient id="space-space-probe-inner" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5b637a"/>
      <stop offset="0.4" stop-color="#aab1c0"/>
      <stop offset="0.75" stop-color="#eef0f5"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="space-space-probe-back" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#eef0f5"/>
      <stop offset="0.3" stop-color="#dfe3ea"/>
      <stop offset="0.6" stop-color="#9aa2b5"/>
      <stop offset="1" stop-color="#3f4658"/>
    </linearGradient>
    <!-- Cylinder across its axis: lit edge, specular band a third in, dark shadow edge. -->
    <linearGradient id="space-space-probe-cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bfcc"/>
      <stop offset="0.3" stop-color="#f7f8fb"/>
      <stop offset="0.62" stop-color="#9aa2b5"/>
      <stop offset="1" stop-color="#3a4050"/>
    </linearGradient>
    <linearGradient id="space-space-probe-cylx" href="#space-space-probe-cyl" x2="1" y2="0"/>
    <linearGradient id="space-space-probe-rtg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8b93a6"/>
      <stop offset="0.3" stop-color="#dfe3ea"/>
      <stop offset="0.62" stop-color="#6c7489"/>
      <stop offset="1" stop-color="#2a2f3d"/>
    </linearGradient>
    <linearGradient id="space-space-probe-flat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aab1c0"/>
      <stop offset="1" stop-color="#3f4658"/>
    </linearGradient>
    <clipPath id="space-space-probe-busclip">
      <path d="M67 44 L105 44 L105 61 L101.4 62.8 L91.9 63.9 L80.1 63.9 L70.6 62.8 L67 61 Z"/>
    </clipPath>
  </defs>
  <g transform="translate(-13.5 -2.5)">

  <!-- Magnetometer boom: very long, off the right side. -->
  <path d="M104 58 L215 33.5" stroke="#8b93a6" stroke-width="2.4"/>
  <path d="M104 57 L215 32.5" stroke="#dce8ff" stroke-width="0.6" opacity="0.5"/>
  <circle cx="171" cy="42.6" r="2.4" fill="url(#space-space-probe-flat)"/>
  <rect x="210.5" y="29.5" width="8" height="6" rx="1.2" transform="rotate(-12 214.5 32.5)" fill="url(#space-space-probe-cyl)"/>

  <!-- Science boom down to the instrument platform. -->
  <path d="M102 63 L134 80" stroke="#8b93a6" stroke-width="3.3"/>
  <path d="M102.4 62 L134.4 79" stroke="#dce8ff" stroke-width="0.6" opacity="0.5"/>
  <rect x="129" y="75.5" width="16" height="11.5" rx="1" fill="url(#space-space-probe-flat)"/>
  <path d="M129.5 76 H144.5" stroke="#dce8ff" stroke-width="0.7" opacity="0.5"/>
  <rect x="144" y="77" width="12" height="5" rx="1" fill="url(#space-space-probe-cyl)"/>
  <rect x="144" y="83" width="8.5" height="3.8" rx="1" fill="url(#space-space-probe-cyl)"/>
  <path d="M144 77.2 H146 V86.6 H144 Z" fill="#05070f" opacity="0.3"/>
  <circle cx="137" cy="89.5" r="3.2" fill="url(#space-space-probe-flat)"/>

  <!-- RTG boom down to the left with three finned power units. -->
  <g transform="translate(69 61) rotate(143.8)">
    <path d="M0 0 H64" stroke="#8b93a6" stroke-width="3.3"/>
    <rect x="30" y="-5.5" width="10" height="11" fill="#3c4254"/>
    <rect x="42" y="-5.5" width="10" height="11" fill="#3c4254"/>
    <rect x="54" y="-5.5" width="10" height="11" fill="#3c4254"/>
    <rect x="29" y="-3" width="12" height="6" rx="1" fill="url(#space-space-probe-rtg)"/>
    <rect x="41" y="-3" width="12" height="6" rx="1" fill="url(#space-space-probe-rtg)"/>
    <rect x="53" y="-3" width="12" height="6" rx="1" fill="url(#space-space-probe-rtg)"/>
    <path d="M30 4.3 H40 M42 4.3 H52 M54 4.3 H64" stroke="#a9b3c8" stroke-width="1"/>
    <path d="M30 -4.3 H40 M42 -4.3 H52 M54 -4.3 H64" stroke="#5b637a" stroke-width="1"/>
    <path d="M30 5.2 H40 M42 5.2 H52 M54 5.2 H64" stroke="#dce8ff" stroke-width="0.6" opacity="0.5"/>
    <path d="M40.5 -5.5 V5.5 M52.5 -5.5 V5.5" stroke="#05070f" stroke-width="1.2" opacity="0.5"/>
  </g>

  <!-- Ten-sided bus, gold foil, shadowed where the dish overhangs it. -->
  <g transform="translate(0 3)">
  <path d="M67 44 L70.6 45.8 L80.1 46.9 L91.9 46.9 L101.4 45.8 L105 44 L105 61 L101.4 62.8 L91.9 63.9 L80.1 63.9 L70.6 62.8 L67 61 Z" fill="url(#space-space-probe-gold)"/>
  <path d="M67 44 L70.6 45.8 L70.6 62.8 L67 61 Z" fill="#fff6d0" opacity="0.3"/>
  <path d="M70.6 45.8 L80.1 46.9 L80.1 63.9 L70.6 62.8 Z" fill="#fff6d0" opacity="0.15"/>
  <path d="M91.9 46.9 L101.4 45.8 L101.4 62.8 L91.9 63.9 Z" fill="#3a2a0e" opacity="0.25"/>
  <path d="M101.4 45.8 L105 44 L105 61 L101.4 62.8 Z" fill="#3a2a0e" opacity="0.45"/>
  <path d="M60 40 C66 48 76 54.5 86 54.5 C96 54.5 106 48 112 40 Z" fill="#05070f" opacity="0.3" clip-path="url(#space-space-probe-busclip)"/>
  <path d="M67.4 49 V60.8" stroke="#dce8ff" stroke-width="0.7" opacity="0.5"/>
  <!-- Thruster cone underneath. -->
  <path d="M80 63.9 L92 63.9 L89 69 L83 69 Z" fill="url(#space-space-probe-cylx)"/>
  <path d="M80 63.9 H92 L91.5 65 H80.5 Z" fill="#05070f" opacity="0.3"/>
  </g>

  <!-- High-gain dish: the convex back, then the concave inside. -->
  <path d="M44 29 C45 44 66 54 86 54 C106 54 127 44 128 29 Z" fill="url(#space-space-probe-back)"/>
  <ellipse cx="86" cy="29" rx="42" ry="17" fill="url(#space-space-probe-inner)"/>
  <!-- Shadow of the upper-left rim on the inside. -->
  <path d="M44 29 A42 17 0 0 1 107 14.3 C88 18 60 25 46.6 34.8 A42 17 0 0 1 44 29 Z" fill="#05070f" opacity="0.4"/>
  <path d="M128 29 A42 17 0 0 1 80 45.9 C100 44 120 37.5 128 29 Z" fill="#fff6d0" opacity="0.5"/>
  <ellipse cx="87" cy="30" rx="6" ry="2.5" fill="#5b637a" opacity="0.6"/>
  <ellipse cx="86" cy="29" rx="41.6" ry="16.6" fill="none" stroke="#f4f6fa" stroke-width="0.9" opacity="0.85"/>

  <!-- Feed and its tripod. -->
  <path d="M54 39 L86 9 L118 39 M86 12 V30" fill="none" stroke="#c8ccd6" stroke-width="1.6"/>
  <rect x="82" y="3" width="8" height="7" rx="1.5" fill="url(#space-space-probe-cylx)"/>
  </g>
</svg>
