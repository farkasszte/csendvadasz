    <ellipse cx="3" cy="-2" rx="68" ry="57" fill="url(#space-ring-nebula-rim)" opacity="0.5"/>
    <g fill="url(#space-ring-nebula-ember)">
      <ellipse rx="5.3" ry="3.5" opacity="0.536" transform="translate(56.3 -4.7) rotate(108.8)"/>
      <ellipse rx="4.7" ry="3.9" opacity="0.583" transform="translate(51.7 17.8) rotate(91.4)"/>
      <ellipse rx="4.4" ry="3.2" opacity="0.374" transform="translate(43.9 33.2) rotate(133.8)"/>
      <ellipse rx="5.9" ry="3" opacity="0.495" transform="translate(18.8 40.2) rotate(148.2)"/>
      <ellipse rx="4.9" ry="2.1" opacity="0.301" transform="translate(-22 39.1) rotate(200)"/>
      <ellipse rx="6.8" ry="3.5" opacity="0.5720000000000001" transform="translate(-32 34.5) rotate(203.3)"/>
      <ellipse rx="6.4" ry="3.1" opacity="0.532" transform="translate(-53.2 21.9) rotate(265.9)"/>
      <ellipse rx="5.5" ry="3.4" opacity="0.499" transform="translate(-56.2 2.8) rotate(266.3)"/>
      <ellipse rx="6.7" ry="3.9" opacity="0.596" transform="translate(-50.5 -22.9) rotate(-49)"/>
      <ellipse rx="6.9" ry="2.2" opacity="0.425" transform="translate(-36.6 -34.9) rotate(-17.1)"/>
      <ellipse rx="6.2" ry="3.5" opacity="0.634" transform="translate(-17.1 -46.1) rotate(-6.1)"/>
      <ellipse rx="4.3" ry="3.5" opacity="0.62" transform="translate(5.8 -43.7) rotate(21)"/>
      <ellipse rx="5.3" ry="3.1" opacity="0.605" transform="translate(39 -35.1) rotate(43.5)"/>
      <ellipse rx="5.3" ry="2.4" opacity="0.43799999999999994" transform="translate(52.7 -13) rotate(82.3)"/>
    </g>

