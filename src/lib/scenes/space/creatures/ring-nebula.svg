<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 170">
  <defs>
    <radialGradient id="space-ring-nebula-halo">
      <stop offset="0.4" stop-color="#c44b3a" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#c44b3a" stop-opacity="0.16"/>
      <stop offset="0.82" stop-color="#6a4c9c" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#6a4c9c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="space-ring-nebula-rim">
      <stop offset="0.6" stop-color="#e8743b" stop-opacity="0"/>
      <stop offset="0.76" stop-color="#e8743b" stop-opacity="0.75"/>
      <stop offset="0.86" stop-color="#c44b3a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c44b3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="space-ring-nebula-body">
      <stop offset="0.35" stop-color="#3d5ea6" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#4a8ec8" stop-opacity="0.45"/>
      <stop offset="0.7" stop-color="#4fb8ae" stop-opacity="0.85"/>
      <stop offset="0.84" stop-color="#8fd2a0" stop-opacity="0.55"/>
      <stop offset="0.94" stop-color="#f3dc92" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#f3dc92" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="space-ring-nebula-hollow">
      <stop offset="0" stop-color="#7f9ed8" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#3d6aae" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3d5ea6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="space-ring-nebula-knot">
      <stop offset="0" stop-color="#b8f0e0" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#4fb8ae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="space-ring-nebula-dark">
      <stop offset="0" stop-color="#060a17" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#060a17" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="space-ring-nebula-ember">
      <stop offset="0" stop-color="#f2b36b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#e8743b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="space-ring-nebula-wisp">
      <stop offset="0" stop-color="#c44b3a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c44b3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="space-ring-nebula-star">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="0.25" stop-color="#dce8ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#a9c4f5" stop-opacity="0"/>
    </radialGradient>
  </defs>

