    <ellipse cx="-2" cy="1.5" rx="61" ry="50" fill="url(#space-ring-nebula-body)" opacity="0.45"/>
    <!-- M57 is brightest along its long sides. -->
    <ellipse cy="-36" rx="36" ry="16" fill="url(#space-ring-nebula-knot)" opacity="0.45"/>
    <ellipse cy="37" rx="34" ry="15" fill="url(#space-ring-nebula-knot)" opacity="0.4"/>
    <g fill="url(#space-ring-nebula-knot)">
      <ellipse rx="3.1" ry="2.4" opacity="0.505" transform="translate(46.2 -4) rotate(-21)"/>
      <ellipse rx="3.9" ry="2.6" opacity="0.49" transform="translate(43.5 7.2) rotate(29.6)"/>
      <ellipse rx="4.3" ry="1.8" opacity="0.494" transform="translate(32.4 16) rotate(22.8)"/>
      <ellipse rx="4.5" ry="2.4" opacity="0.293" transform="translate(29.5 22.6) rotate(73.4)"/>
      <ellipse rx="4" ry="3" opacity="0.569" transform="translate(21.4 30.4) rotate(70.7)"/>
      <ellipse rx="3.4" ry="2.1" opacity="0.303" transform="translate(14.9 29) rotate(91.2)"/>
      <ellipse rx="3.9" ry="2.9" opacity="0.505" transform="translate(5.3 30.7) rotate(112.8)"/>
      <ellipse rx="3.8" ry="2" opacity="0.39799999999999996" transform="translate(-1 30.7) rotate(95.7)"/>
      <ellipse rx="3.4" ry="3" opacity="0.483" transform="translate(-15.6 25.7) rotate(106.4)"/>
      <ellipse rx="3.3" ry="2.3" opacity="0.37799999999999995" transform="translate(-21.2 24.4) rotate(118.2)"/>
      <ellipse rx="3.2" ry="2.3" opacity="0.5670000000000001" transform="translate(-30.1 23) rotate(144.4)"/>
      <ellipse rx="3.8" ry="2.7" opacity="0.42700000000000005" transform="translate(-39.5 13.5) rotate(166.2)"/>
      <ellipse rx="3.2" ry="2.2" opacity="0.455" transform="translate(-39.5 4.7) rotate(186.2)"/>
      <ellipse rx="4.7" ry="2.9" opacity="0.289" transform="translate(-39.9 1.2) rotate(198.5)"/>
      <ellipse rx="2.8" ry="2" opacity="0.599" transform="translate(-39.6 -4.8) rotate(-195.7)"/>
      <ellipse rx="4" ry="3" opacity="0.298" transform="translate(-32.1 -14.4) rotate(-153.7)"/>
      <ellipse rx="4.8" ry="2.1" opacity="0.516" transform="translate(-31.9 -26.7) rotate(-106.7)"/>
      <ellipse rx="2.6" ry="2" opacity="0.466" transform="translate(-24.9 -23.1) rotate(-160.4)"/>
      <ellipse rx="3.2" ry="2" opacity="0.5589999999999999" transform="translate(-12.5 -31.3) rotate(-94.6)"/>
      <ellipse rx="3.8" ry="3" opacity="0.251" transform="translate(-6.8 -36.5) rotate(-125.2)"/>
      <ellipse rx="4.8" ry="3.1" opacity="0.316" transform="translate(7 -36.8) rotate(-114.9)"/>
      <ellipse rx="3.1" ry="2.5" opacity="0.32299999999999995" transform="translate(16 -32.4) rotate(-84.8)"/>
      <ellipse rx="4.3" ry="1.7" opacity="0.424" transform="translate(21.7 -31.2) rotate(-46.9)"/>
      <ellipse rx="4.3" ry="1.7" opacity="0.563" transform="translate(32.1 -26.9) rotate(-72.2)"/>
      <ellipse rx="4.9" ry="2.3" opacity="0.518" transform="translate(42.2 -14.3) rotate(11.6)"/>
      <ellipse rx="3.6" ry="2.3" opacity="0.332" transform="translate(42.2 -10.3) rotate(9.8)"/>
    </g>
    <g fill="url(#space-ring-nebula-dark)">
      <ellipse rx="5.4" ry="2.3" opacity="0.272" transform="translate(46.1 11.8) rotate(4.4)"/>
      <ellipse rx="4.4" ry="3.4" opacity="0.317" transform="translate(33.9 25.3) rotate(15.9)"/>
      <ellipse rx="4.1" ry="2" opacity="0.256" transform="translate(16.8 40.3) rotate(109.2)"/>
      <ellipse rx="6.3" ry="2.1" opacity="0.22699999999999998" transform="translate(-6.8 38.3) rotate(122.5)"/>
      <ellipse rx="5.1" ry="2.6" opacity="0.24100000000000002" transform="translate(-26.4 26.6) rotate(143.1)"/>
      <ellipse rx="3.6" ry="2.7" opacity="0.19399999999999998" transform="translate(-45.3 2.9) rotate(198)"/>
      <ellipse rx="4.2" ry="2.5" opacity="0.259" transform="translate(-50.8 -1.9) rotate(-196.1)"/>
      <ellipse rx="6.2" ry="2.9" opacity="0.304" transform="translate(-44.8 -20.4) rotate(-121.3)"/>
      <ellipse rx="5.3" ry="3.2" opacity="0.27" transform="translate(9 -31.5) rotate(-53.6)"/>
      <ellipse rx="3.8" ry="1.8" opacity="0.155" transform="translate(2.4 -33.6) rotate(-124.4)"/>
      <ellipse rx="3.9" ry="2.9" opacity="0.17600000000000002" transform="translate(47.9 -20.3) rotate(-55.6)"/>
    </g>

    <!-- Translucent bluish hollow. -->
    <g class="part-pulse">
      <ellipse rx="40" ry="31" fill="url(#space-ring-nebula-hollow)"/>
    </g>

    <!-- The hot white dwarf at the centre. -->
    <circle r="5" fill="url(#space-ring-nebula-star)"/>
  </g>
</svg>
