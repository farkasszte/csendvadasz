      <ellipse rx="17.4" ry="3.5" opacity="0.2" transform="translate(45.2 39.6) rotate(127.9)"/>
      <ellipse rx="17.2" ry="3.7" opacity="0.243" transform="translate(31.3 45.9) rotate(161.1)"/>
      <ellipse rx="10.9" ry="3.2" opacity="0.35700000000000004" transform="translate(-33.6 55.7) rotate(189.5)"/>
      <ellipse rx="11" ry="5.1" opacity="0.28300000000000003" transform="translate(-60.3 36.1) rotate(245.7)"/>
      <ellipse rx="16.2" ry="5.1" opacity="0.376" transform="translate(-74.6 -1.6) rotate(-84.1)"/>
      <ellipse rx="14.9" ry="4.7" opacity="0.256" transform="translate(-62.7 -18.4) rotate(-92.5)"/>
      <ellipse rx="15" ry="3.8" opacity="0.40299999999999997" transform="translate(-53.3 -34.9) rotate(-44.7)"/>
      <ellipse rx="13.3" ry="4.9" opacity="0.39799999999999996" transform="translate(8.9 -52.3) rotate(17.3)"/>
