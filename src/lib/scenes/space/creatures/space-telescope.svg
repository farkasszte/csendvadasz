<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 248">
  <defs>
    <linearGradient id="space-space-telescope-cells" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4466b0"/>
      <stop offset="0.4" stop-color="#1f3470"/>
      <stop offset="1" stop-color="#101b40"/>
    </linearGradient>
    <linearGradient id="space-space-telescope-tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c0cc"/>
      <stop offset="0.3" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d4d8e0"/>
      <stop offset="0.8" stop-color="#7a8295"/>
      <stop offset="1" stop-color="#343a4a"/>
    </linearGradient>
    <linearGradient id="space-space-telescope-bore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="1" stop-color="#1f2638"/>
    </linearGradient>
    <linearGradient id="space-space-telescope-dish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#8e97ad"/>
    </linearGradient>
    <clipPath id="space-space-telescope-door">
      <ellipse cx="228.5" cy="80" rx="11" ry="24" transform="rotate(16 228 102)"/>
    </clipPath>
    <clipPath id="space-space-telescope-body">
      <path d="M8 92 L104 92 L104 156 L8 156 A7 32 0 0 1 8 92 Z M102 100 L228 100 A7 24 0 0 1 228 148 L102 148 Z"/>
    </clipPath>
  </defs>

  <!-- Far antenna, behind the tube. -->
  <path d="M145 104 L152 91" stroke="#8b93a6" stroke-width="1.6"/>
  <ellipse cx="154.5" cy="87" rx="8" ry="3.2" transform="rotate(-35 154.5 87)" fill="#8e97ad"/>

  <!-- Solar array wings on their masts. -->
  <path d="M110 106 L110 88 M110 142 L110 160" stroke="#8b93a6" stroke-width="2.4"/>
  <rect x="97" y="2" width="26" height="86" fill="url(#space-space-telescope-cells)"/>
  <path d="M97 9.8 H123 M97 17.6 H123 M97 25.4 H123 M97 33.2 H123 M97 41.0 H123 M97 48.9 H123 M97 56.7 H123 M97 64.5 H123 M97 72.3 H123 M97 80.1 H123 M103.5 2 V88 M116.5 2 V88" stroke="#6f8fd0" stroke-width="0.6" opacity="0.4"/>
  <path d="M97 2 L110 2 L97 36.4 Z" fill="#dce8ff" opacity="0.12"/>
  <rect x="121" y="2" width="2" height="86" fill="#05070f" opacity="0.35"/>
  <path d="M97 2 H123 V88 H97 Z M110 2 V88" fill="none" stroke="#a9b3c8" stroke-width="1.2"/>
  <rect x="97" y="160" width="26" height="86" fill="url(#space-space-telescope-cells)"/>
  <path d="M97 167.8 H123 M97 175.6 H123 M97 183.4 H123 M97 191.2 H123 M97 199.0 H123 M97 206.9 H123 M97 214.7 H123 M97 222.5 H123 M97 230.3 H123 M97 238.1 H123 M103.5 160 V246 M116.5 160 V246" stroke="#6f8fd0" stroke-width="0.6" opacity="0.4"/>
  <path d="M97 160 L110 160 L97 194.4 Z" fill="#dce8ff" opacity="0.12"/>
  <rect x="121" y="160" width="2" height="86" fill="#05070f" opacity="0.35"/>
  <path d="M97 160 H123 V246 H97 Z M110 160 V246" fill="none" stroke="#a9b3c8" stroke-width="1.2"/>

  <!-- Body: wide aft section, narrower forward tube, then crinkled foil. -->
  <path d="M8 92 L104 92 L104 156 L8 156 A7 32 0 0 1 8 92 Z" fill="url(#space-space-telescope-tube)"/>
  <path d="M102 100 L228 100 A7 24 0 0 1 228 148 L102 148 Z" fill="url(#space-space-telescope-tube)"/>
  <g clip-path="url(#space-space-telescope-body)">
    <!-- Foil wraps: alternate darker bands. -->
    <path d="M38 80 L72 80 L72 160 L38 160 Z M142 80 L184 80 L184 160 L142 160 Z" fill="#05070f" opacity="0.16"/>
    <!-- Equipment ring: flat bay panels round the circumference. -->
    <path d="M72 92 L104 92 L104 102 L72 102 Z M72 114 L104 114 L104 126 L72 126 Z" fill="#dce8ff" opacity="0.3"/>
    <path d="M72 138 L104 138 L104 156 L72 156 Z" fill="#05070f" opacity="0.2"/>
    <path d="M72 102 H111 M72 114 H111 M72 126 H111 M72 138 H111 M72 148 H111" stroke="#5b637a" stroke-width="0.7" opacity="0.8"/>
    <!-- A few big, flat planes of crinkled foil per section. -->
    <path d="M-4 92 L38 92 L32 118 L-4 112 Z M104 100 L142 100 L138 116 L104 110 Z M184 100 L242 100 L242 113 L188 120 Z" fill="#dce8ff" opacity="0.3"/>
    <path d="M38 92 L72 92 L72 104 L42 116 Z M142 100 L184 100 L180 110 L146 118 Z" fill="#dce8ff" opacity="0.22"/>
    <path d="M42 116 L72 104 L72 140 L38 134 Z M146 118 L180 110 L184 132 L142 136 Z" fill="#05070f" opacity="0.13"/>
    <path d="M-4 128 L34 120 L38 156 L-4 156 Z M104 124 L138 116 L142 148 L104 148 Z M188 120 L242 113 L242 150 L184 150 Z" fill="#05070f" opacity="0.17"/>
    <!-- Contact shadows: the wide aft section shades the tube step; the door bracket shades the rim. -->
    <path d="M104 100 L111 100 L111 148 L104 148 Z M216 100 L228 100 L228 103.5 L216 103.5 Z" fill="#05070f" opacity="0.3"/>
  </g>
  <!-- Rim light on the sunlit top edges. -->
  <path d="M5.5 94 Q6.5 92.3 8 92.2 L103 92.2 M105 100.2 L227 100.2" fill="none" stroke="#dce8ff" stroke-width="0.7" opacity="0.5"/>
  <path d="M38 92 L38 156 M72 92 L72 156 M142 100 L142 148 M184 100 L184 148" stroke="#5b637a" stroke-width="0.9" opacity="0.8"/>
  <path d="M104 92 L104 156" stroke="#3a3f4c" stroke-width="1.4"/>

  <!-- Open aperture: the dark bore, and the door hinged up at the top. -->
  <ellipse cx="228" cy="124" rx="6" ry="22" fill="url(#space-space-telescope-bore)"/>
  <path d="M228 102 A6 22 0 0 0 228 146" fill="none" stroke="#dce8ff" stroke-width="1" opacity="0.45"/>
  <!-- Door: a disc the size of the mouth, hinged on the top of the rim and
       flipped up and a little forward. Rim edge on the left, foil face right. -->
  <g clip-path="url(#space-space-telescope-door)">
    <g transform="rotate(16 228 102)">
      <ellipse cx="228.5" cy="80" rx="11" ry="24" fill="#3a3f4c"/>
      <ellipse cx="231" cy="79.5" rx="11" ry="24" fill="url(#space-space-telescope-tube)"/>
      <path d="M224 56 L238 54 L236 70 L226 74 Z" fill="#dce8ff" opacity="0.34"/>
      <path d="M230 78 L240 70 L240 90 L232 92 Z" fill="#05070f" opacity="0.22"/>
      <path d="M218 90 L242 86 L242 110 L218 110 Z" fill="#05070f" opacity="0.2"/>
    </g>
  </g>
  <!-- Hinge bracket bridging rim and door. -->
  <path d="M221 98.5 L233 98.5 L232 104 L222 104 Z" fill="#5b637a"/>
  <path d="M221 98.5 L233 98.5" stroke="#c8ccd6" stroke-width="1"/>
  <circle cx="228" cy="101.5" r="2" fill="#8b93a6"/>

  <!-- Near high-gain antenna on a short boom. -->
  <path d="M136 144 L144 144 L144 148 L136 148 Z" fill="#05070f" opacity="0.3"/>
  <rect x="137" y="145" width="6" height="3" fill="#5b637a"/>
  <path d="M140 147 L149 160" stroke="#8b93a6" stroke-width="1.8"/>
  <ellipse cx="152" cy="164.5" rx="11" ry="4.6" transform="rotate(-35 152 164.5)" fill="url(#space-space-telescope-dish)"/>
  <ellipse cx="152.6" cy="163.8" rx="8.2" ry="3" transform="rotate(-35 152.6 163.8)" fill="#5b637a" opacity="0.35"/>
</svg>
